[package]
name = "herdr-tasks"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Cross-project task board for herdr: grouped list, kanban when wide, CLI + agent skill."
license = "MIT"

[lib]
name = "herdr_tasks"
path = "src/lib.rs"

[[bin]]
name = "herdr-tasks"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
notify = "6"
notify-debouncer-mini = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
unicode-width = "=0.2.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = "1"
filetime = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
